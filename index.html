<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>260311_Muqarnas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="controls">
        <h1>Recursive Muqarnas Models</h1>
        <p class="subtitle">Octagonal Seljuk case studies from Kayseri and Sivas.</p>

        <div class="control-grid">
          <label>
            Case Study
            <select id="presetSelect"></select>
          </label>

          <section class="preset-panel" aria-live="polite">
            <div>
              <h2 id="presetName"></h2>
              <p id="presetDescription"></p>
            </div>
            <dl>
              <div>
                <dt>Location</dt>
                <dd id="presetLocation"></dd>
              </div>
              <div>
                <dt>Pattern</dt>
                <dd id="presetCadence"></dd>
              </div>
              <div>
                <dt>Source</dt>
                <dd id="presetFigure"></dd>
              </div>
            </dl>
          </section>

          <h3 class="group-title">Model</h3>

          <label>
            Layers
            <div class="inline-row">
              <input id="layers" type="range" min="1" max="18" step="1" />
              <output id="layersValue" for="layers"></output>
            </div>
          </label>

          <label>
            Layer Height
            <div class="inline-row">
              <input id="layerHeight" type="range" min="0.25" max="2.5" step="0.05" />
              <output id="layerHeightValue" for="layerHeight"></output>
            </div>
          </label>

          <label>
            Silver-Ratio Scale
            <div class="inline-row">
              <input id="ratioScale" type="range" min="0.4" max="2.2" step="0.05" />
              <output id="ratioScaleValue" for="ratioScale"></output>
            </div>
          </label>

          <label>
            Tile Diagonal
            <select id="connectionType">
              <option value="convergent">Convergent</option>
              <option value="divergent">Divergent</option>
            </select>
          </label>

          <h3 class="group-title">Display</h3>

          <label class="inline-check">
            <input id="showTiles" type="checkbox" checked />
            <span>Tile surfaces</span>
          </label>

          <label class="inline-check">
            <input id="showProfiles" type="checkbox" checked />
            <span>Layer profiles</span>
          </label>

          <label class="inline-check">
            <input id="showGrowthArrows" type="checkbox" checked />
            <span>Growth axes</span>
          </label>

          <label class="inline-check">
            <input id="showPointMarkers" type="checkbox" />
            <span>Point markers</span>
          </label>

          <label class="inline-check">
            <input id="showAnnotations" type="checkbox" />
            <span>Point labels</span>
          </label>

          <details>
            <summary>Recursive rules</summary>
            <div id="ruleSummary" class="rule-summary"></div>
          </details>

          <button id="resetView" type="button">Reset Camera</button>
        </div>
      </aside>

      <main class="viewer-shell">
        <section class="panel">
          <header>
            <h2>2D Plan</h2>
            <p>Layer contours, minimal face bands, and recursive axes.</p>
          </header>
          <canvas id="planCanvas"></canvas>
        </section>

        <section class="panel">
          <header>
            <h2>3D Model</h2>
            <p>Stacked surfaces generated from the same recursive rule set.</p>
          </header>
          <div id="threeRoot"></div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/main.js?v=20260501b"></script>
  </body>
</html>
